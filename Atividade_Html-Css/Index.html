<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frete Grátis</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <h1>Verificação de Frete</h1>

        <label for="valor">Digite o valor da compra:</label>

        <input 
            type="number" 
            id="valor" 
            placeholder="Ex: 250"
        >

        <button onclick="verificarFrete()">
            Verificar
        </button>

        <div class="card">
            <p id="resultado"></p>
        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
